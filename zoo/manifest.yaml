# Model-zoo published weights: download + sha256-verify + cache (see vidaudit/zoo.py).
# Each entry records a sha256 so the checkpoint verifies on load.
#
# We do NOT mirror weights. FVMD's point tracker is a public release and auto-fetches.
# The others: obtain each from its ORIGINAL release (see `paper`/the README weights table)
# and pass it explicitly -- the sha256 below verifies it:
#     python run.py extract <model> --weights /path/to/ckpt
#     # or in code: detector.load_weights("/path/to/ckpt")
# If a future release publishes a public URL, drop it into `url` and fetch_weights will
# download + sha256-verify automatically.

waverep:
  paper: "Corvi et al., NeurIPS 2025 (arXiv:2506.16802)"
  license: "GRIP-UNINA / NVIDIA, non-commercial"
  backbone: "timm vit_base_patch14_reg4_dinov2.lvd142m (img_size=504, num_classes=1)"
  weights:
    - file: weights_dinov2_G4.ckpt
      url: ""              # original GRIP-UNINA release (pass --weights): https://www.grip.unina.it/download/prog/WaveRep_SynthVideoDet/weights_dinov2_G4.ckpt
      sha256: "50d639049d928986ba7d69861a4fe4f3e7afbba1843e3e089cdf6b4748f53d5b"
      size_mb: 331

fvmd:
  paper: "FVMD (Liu et al., 2024)"
  license: "MIT (PIPs++ point tracker)"
  backbone: "PIPs++ persistent point tracker"
  weights:
    - file: pips2_weights.pth
      url: "https://github.com/ljh0v0/FVMD-frechet-video-motion-distance/releases/download/pips2_weights/pips2_weights.pth"
      sha256: ""           # public release; fill after first download if you want verification
      size_mb: null

aigvdet:
  paper: "Bai, Lin, Cao; PRCV 2024 (arXiv:2403.16638)"
  license: "academic research only (non-commercial); see the AIGVDet repo"
  backbone: "two-stream ResNet50 (RGB + RAFT optical-flow visualization)"
  weights:
    - file: original.pth      # spatial branch
      url: ""                 # Google Drive (academic-only): gdown 10EXwX9cXR0VuBmWq7QpMfotnPtIRKIsV; pass --weights <dir>
      sha256: ""
      size_mb: 270
    - file: optical.pth       # optical branch
      url: ""                 # Google Drive (academic-only): gdown 1MiMkASZ-SDisCuLi-A7R-Yvqjzsy_BMC; pass --weights <dir>
      sha256: ""
      size_mb: 270

nsgvd:
  paper: "Zhang et al., NeurIPS 2025 (arXiv:2510.08073)"
  license: "see NSG-VD repo"
  backbone: "SingleSwinBlock diffusion-noise-score discriminator (per-generator ckpts)"
  weights:
    - file: standard-Pika-mp.pth
      url: ""              # original repo ZSHsh98/NSG-VD (pass --weights): https://raw.githubusercontent.com/ZSHsh98/NSG-VD/main/ckpts/standard-Pika-mp.pth
      sha256: "c1d2a9121f5172e79c47ceb15df29987c9828ee03e1fd8302477a8a12bf7599f"
      size_mb: 2

# NSG-VD also needs the ADM 256x256 unconditional diffusion model (Dhariwal & Nichol)
# for the score function. Pass via NSGVD(adm_ckpt=...) or fetch_weights('nsgvd-adm').
nsgvd-adm:
  paper: "Dhariwal & Nichol 2021 (guided diffusion / ADM)"
  license: "OpenAI guided-diffusion (MIT)"
  weights:
    - file: 256x256_diffusion_uncond.pt
      url: ""              # OpenAI guided-diffusion (pass --weights): https://openaipublic.blob.core.windows.net/diffusion/jul-2021/256x256_diffusion_uncond.pt
      sha256: "a37c32fffd316cd494cf3f35b339936debdc1576dad13fe57c42399a5dbc78b1"
      size_mb: 2109

l3de:
  paper: "Chang et al., ICCV 2025 (arXiv:2406.19568)"
  license: "CC-BY-NC-4.0 (NON-COMMERCIAL; driven by the UniDepth-v2 depth proxy). L3DE head + DINOv2 Apache-2.0, RAFT BSD-3."
  backbone: "DINOv2-ViT-G + RAFT flow + UniDepth-v2 depth -> 3D-CNN (Net, T=24)"
  weights:
    - file: L3DE.pth
      url: ""              # not mirrored: authors' Google Drive (id 1wBAAsJPcsT_bIKXetDbd23PKjmCUtb5s); pass --weights <L3DE.pth>
      sha256: ""
      size_mb: null
# L3DE also needs UniDepth-v2 (auto-downloads from HF lpiccinelli/unidepth-v2-vits14; CC-BY-NC),
# DINOv2-ViT-G (torch.hub, Apache-2.0), and RAFT (torchvision). Non-commercial use only.

stall:
  paper: "Ben Hayun et al., CVPR 2026 (arXiv:2603.15026)"
  license: "code/params undeclared (all-rights-reserved by default); DINOv3 backbone under the Meta DINOv3 License (gated)"
  backbone: "DINOv3 ViT-L/16 (frozen) + whitened spatial/temporal Gaussian likelihood (training-free)"
  weights:
    - file: stall_params_vatex_dino_v3.npz
      url: ""              # not mirrored: obtain from the STALL repo (github.com/OmerBenHayun/STALL); pass --weights <npz>
      sha256: ""
      size_mb: 17
# STALL is training-free: the only artifact is the VATEX calibration npz above. The DINOv3
# ViT-L/16 backbone is GATED (request access from Meta) and supplied via STALL(dinov3_dir=, dinov3_weights=).
