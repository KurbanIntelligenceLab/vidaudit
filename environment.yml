# Unified conda env for the whole vidaudit toolkit.
#   conda env create -f environment.yml  &&  conda activate vidaudit
#
# Pinned with ~= (compatible release: patch updates only, minor/major locked) for
# reproducibility; environment.lock.yml is the exact snapshot. Bump deliberately to
# modernize. torch is from conda-forge, not pip (pip's torch bundles a 2nd OpenMP
# runtime that aborts with "OMP Error #15" on macOS).
name: vidaudit
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14

  # --- scientific core (audit metrics, matched-cell L2-LR readout, CSV/leaderboard) ---
  - numpy~=2.4.6
  - scipy~=1.17.1
  - scikit-learn~=1.9.0
  - pandas~=3.0.3
  - pyyaml~=6.0.3
  - tabulate~=0.10.0

  # --- gradient-boosted readouts used in the audit sweeps ---
  - lightgbm~=4.6.0
  - xgboost~=3.2.0

  # --- video / codec: P1 canonical re-encode, P2 K-frame filter, TemporalSpec motion vectors ---
  - ffmpeg~=8.1.1
  - av~=17.0.1          # PyAV: codec motion-vector extraction (imports as `av`)
  - opencv~=4.13.0

  # --- figures + leaderboard rendering ---
  - matplotlib~=3.10.9

  # --- deep backbones (DINOv2, XCLIP, CLIP, RAFT): from conda-forge, NOT pip, so the
  #     whole stack shares ONE OpenMP runtime (see header re "OMP Error #15"). ---
  - pytorch~=2.10.0
  - torchvision~=0.26.0

  # --- utilities + tests ---
  - tqdm~=4.67.3
  - rich~=15.0.0
  - requests~=2.34.2
  - pytest~=9.0.3
  - pip

  # --- pip (backbone hubs + data/weights distribution) ---
  - pip:
      - transformers~=5.10.1     # XCLIP, CLIP via HuggingFace
      - timm~=1.0.27             # DINOv2 backbones
      - open_clip_torch~=3.3.0   # CLIP variants
      - huggingface_hub~=1.17.0  # weights + data fetch/verify/cache
      - datasets~=4.8.5          # HuggingFace data package
      - mlcroissant~=1.1.0       # Croissant metadata for the data package
      - safetensors~=0.7.0
